                    - 1
                  default: 0
                  description: >-
                    Source CEX account type. Enum: `0` (SPOT), `1` (FUNDING). Default `0`. Must be `0` or `1`; any other
                    value is rejected
                  x-description-cn: 來源 CEX 賬戶型別。列舉值：`0`（現貨）、`1`（資金賬戶）。預設 `0`。必須為 `0` 或 `1`，其他值會被拒絕
                name:
                  type: string
                  example: MM withdraw
                  description: Remark for the withdraw
                  x-description-cn: 出金備註
      responses:
        "200":
          description: Apply MM Withdraw
          x-description-cn: 申請 MM 出金
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "123456789"
                  walletId:
                    type: string
