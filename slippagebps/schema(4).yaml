          | 其他（如 `99`）   | 拒絕 — 返回參數校驗錯誤    |
        - "欄位命名說明：本介面用 `walletType`（INT `0`/`1`）表示來源 CEX 賬戶，而「申請 MM 入金」用 `accountType`（STRING
