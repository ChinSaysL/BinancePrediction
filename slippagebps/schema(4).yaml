  /sapi/v1/w3w/wallet/prediction/withdraw/apply:
    post:
      summary: Apply MM Withdraw (PREDICTION_TRADE)
      x-summary-cn: 申請 MM 出金 (PREDICTION_TRADE)
      description: >-
        Withdraw funds from the user's CEX account (SPOT/FUNDING) to their bound CeDeFi MPC wallet address. Unlike
        `v1/capital/withdraw/apply`, the caller does NOT pass `address`; the backend resolves the user's bound CeDeFi
        MPC wallet address by `userId` and reuses the existing capital withdraw flow with that address as the target.
      x-description-cn: >-
        將資金從使用者 CEX 賬戶（現貨/資金賬戶）出金到綁定的 CeDeFi MPC 錢包地址。與 `v1/capital/withdraw/apply` 不同， 呼叫方無需傳 `address`；後端根據 `userId`
        解析綁定的 CeDeFi MPC 錢包地址，複用現有出金流程，以該地址作為目標。
      tags:
        - transfer
      operationId: applyMmWithdraw
      externalDocs:
        url: >-
          https://developers.binance.com/en/docs/catalog/web3-wallet-prediction-trading/api/rest-api/transfer#apply-mm-withdraw
      x-connectors-examples:
