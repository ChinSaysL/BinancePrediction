        python: >-
          https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/w3w_prediction/examples/rest_api/Transfer/apply_mm_withdraw.py
        java: >-
          https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/w3w-prediction/src/main/java/com/binance/connector/client/w3w_prediction/rest/transfer/ApplyMmWithdrawExample.java
        go: >-
          https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/w3wprediction/examples/restapi/TransferAPI/ApplyMmWithdraw/ApplyMmWithdraw.go
        php: >-
          https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/w3w-prediction/transfer/ApplyMmWithdrawExample.php
      x-ip-weight: 1
      x-security-type: PREDICTION_TRADE
      x-signed: true
