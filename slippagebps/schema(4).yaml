openapi: 3.0.2
info:
  title: Prediction Trading REST API
  description: Place and manage prediction market orders, query positions, and transfer funds via the Prediction Trading REST API.
  x-description-cn: 通過預測市場交易 REST API 下單、管理預測訂單、查詢持倉並進行資金劃轉。
  version: 1.0.0
  termsOfService: https://www.binance.com/en/terms
  contact:
    name: Binance API Support
    url: https://www.binance.com/en/support
x-product-type: rest-api
externalDocs:
  description: Prediction Trading docs
  url: https://developers.binance.com/en/docs/products/w3w-prediction/change-log
tags:
  - name: market-data
    x-displayName: Market Data
    x-displayName-cn: 市場資料
  - name: wallet
    x-displayName: Wallet
    x-displayName-cn: 錢包
  - name: trade
    x-displayName: Trade
    x-displayName-cn: 交易
  - name: position
    x-displayName: Position
    x-displayName-cn: 持倉
  - name: redeem
    x-displayName: Redeem
    x-displayName-cn: 贖回
  - name: transfer
    x-displayName: Transfer
    x-displayName-cn: 劃轉
  - name: otc
    x-displayName: OTC Blocktrade
    x-displayName-cn: OTC大宗交易
servers:
  - url: https://api.binance.com
  - url: https://api-gcp.binance.com
  - url: https://api1.binance.com
  - url: https://api2.binance.com
  - url: https://api3.binance.com
  - url: https://api4.binance.com
paths:
  /sapi/v1/w3w/wallet/prediction/category/list:
    get:
      summary: List Prediction Categories
      x-summary-cn: 獲取預測分類列表
      description: Get all available prediction market categories (L1 and L2).
      x-description-cn: 獲取所有可用的預測市場分類（一級和二級分類）。
      tags:
        - market-data
      operationId: listPredictionCategories
      externalDocs:
        url: >-
          https://developers.binance.com/en/docs/catalog/web3-wallet-prediction-trading/api/rest-api/market-data#list-prediction-categories
      x-connectors-examples:
        ts: >-
          https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/w3w-prediction/examples/rest-api/MarketDataApi/listPredictionCategories.ts
        rust: >-
          https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/w3w_prediction/rest_api/market_data_api/list_prediction_categories.rs
        python: >-
          https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/w3w_prediction/examples/rest_api/MarketData/list_prediction_categories.py
        java: >-
          https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/w3w-prediction/src/main/java/com/binance/connector/client/w3w_prediction/rest/marketdata/ListPredictionCategoriesExample.java
        go: >-
          https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/w3wprediction/examples/restapi/MarketDataAPI/ListPredictionCategories/ListPredictionCategories.go
        php: >-
          https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/w3w-prediction/marketdata/ListPredictionCategoriesExample.php
      x-ip-weight: 1
      x-signed: true
      parameters:
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            format: int64
            example: 1770736694138
          description: >-
            Unix timestamp in milliseconds used to sign the request. The value must reflect the current client time and
            is validated by the server for signed endpoints.
          x-description-cn: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        "200":
          description: List Prediction Categories
          x-description-cn: 獲取預測分類列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: crypto
                        name:
                          type: string
                          example: Crypto
                        icon:
                          type: string
                          example: crypto_icon
                        order:
                          type: integer
                          example: 1
                        subcategories:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                example: up-down
                              name:
                                type: string
                                example: Up/Down
                              icon:
                                type: string
                                example: updown_icon
                              order:
                                type: integer
                                example: 1
  /sapi/v1/w3w/wallet/prediction/market/list:
    get:
      summary: List Prediction Markets
      x-summary-cn: 獲取預測市場列表
      description: Get a paginated list of prediction market topics, with optional category and sort filters.
      x-description-cn: 獲取預測市場主題的分頁列表，支援分類篩選和排序。
      tags:
        - market-data
      operationId: listPredictionMarkets
      externalDocs:
        url: >-
          https://developers.binance.com/en/docs/catalog/web3-wallet-prediction-trading/api/rest-api/market-data#list-prediction-markets
      x-connectors-examples:
        ts: >-
          https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/w3w-prediction/examples/rest-api/MarketDataApi/listPredictionMarkets.ts
        rust: >-
          https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/w3w_prediction/rest_api/market_data_api/list_prediction_markets.rs
        python: >-
          https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/w3w_prediction/examples/rest_api/MarketData/list_prediction_markets.py
        java: >-
          https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/w3w-prediction/src/main/java/com/binance/connector/client/w3w_prediction/rest/marketdata/ListPredictionMarketsExample.java
        go: >-
          https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/w3wprediction/examples/restapi/MarketDataAPI/ListPredictionMarkets/ListPredictionMarkets.go
        php: >-
          https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/w3w-prediction/marketdata/ListPredictionMarketsExample.php
      x-ip-weight: 1
      x-signed: true
      parameters:
        - name: l1Category
          in: query
          required: false
          schema:
            type: string
            example: crypto
          description: Level-1 category filter
          x-description-cn: 一級分類篩選
        - name: l2Category
          in: query
          required: false
          schema:
            type: string
            example: up-down
          description: Level-2 category filter
          x-description-cn: 二級分類篩選
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            example: VOLUME
            enum:
              - RECOMMENDED
              - VOLUME
              - PARTICIPANTS
              - CREATED_TIME
              - END_DATE
          description: "Sort field. Enum: `RECOMMENDED`, `VOLUME`, `PARTICIPANTS`, `CREATED_TIME`, `END_DATE`"
          x-description-cn: 排序欄位。列舉值：`RECOMMENDED`、`VOLUME`、`PARTICIPANTS`、`CREATED_TIME`、`END_DATE`
        - name: orderBy
          in: query
          required: false
          schema:
            type: string
            example: DESC
            enum:
              - ASC
              - DESC
          description: "Sort direction. Enum: `ASC`, `DESC`"
          x-description-cn: 排序方向。列舉值：`ASC`、`DESC`
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            example: 0
            format: int32
            default: 0
            minimum: 0
          description: Pagination offset. Default `0`
          x-description-cn: 分頁偏移量，預設 `0`
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            example: 20
            format: int32
            default: 20
            minimum: 1
            maximum: 100
          description: Page size. Default `20`, range 1–100
          x-description-cn: 每頁數量，預設 `20`，範圍 1–100
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            format: int64
            example: 1770736694138
          description: >-
            Unix timestamp in milliseconds used to sign the request. The value must reflect the current client time and
            is validated by the server for signed endpoints.
          x-description-cn: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        "200":
          description: List Prediction Markets
          x-description-cn: 獲取預測市場列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  marketTopics:
                    type: array
                    items:
                      type: object
                      properties:
                        marketTopicId:
                          type: integer
                          example: 4229564
                          format: int64
                        vendor:
                          type: string
                          example: PREDICT_FUN
                        chainId:
                          type: string
                          example: "56"
                        slug:
                          type: string
                          example: btc-price-1h-up-or-down
                        title:
                          type: string
                          example: BTC Price 1h Up or Down?
                        question:
                          type: string
                          example: Will BTC price go UP in the next 1 hour?
                        description:
                          type: string
                          example: Resolves YES if BTC spot price is higher than the starting price at resolution time.
                        imageUrl:
                          type: string
                          example: https://cdn.example.com/prediction/btc-1h.png
                        topicType:
                          type: string
                          example: FLAT
                        chartType:
                          type: string
                          example: CRYPTO_UP_DOWN
                        symbol:
                          type: string
                          example: BTCUSDT
                        participantCount:
                          type: integer
                          example: 3420
                        collateral:
                          type: string
                          example: USDT
                        feeRateBps:
                          type: integer
                          example: 200
                        slippageBps:
                          type: integer
                          example: 1200
                        isYieldBearing:
                          type: boolean
                          example: false
                        tradeVolume:
                          type: string
                          example: "158234.56"
                        liquidity:
                          type: string
                          example: "45000.00"
                        publishedAt:
                          type: integer
                          example: 1748100000000
                          format: int64
                        startDate:
                          type: integer
                          example: 1748131200000
                          format: int64
                        endDate:
                          type: integer
                          example: 1748134800000
                          format: int64
                        status:
                          type: string
                          example: REGISTERED
                        markets:
                          type: array
                          items:
                            type: object
                  total:
                    type: integer
                    example: 128
                  offset:
                    type: integer
                    example: 0
                  limit:
                    type: integer
                    example: 20
                  hasMore:
                    type: boolean
                    example: true
  /sapi/v1/w3w/wallet/prediction/market/search:
    get:
      summary: Market Search
      x-summary-cn: 市場搜尋
      description: Semantic search for prediction market topics by keyword.
      x-description-cn: 通過關鍵詞對預測市場主題進行語義搜尋。
      tags:
        - market-data
      operationId: marketSearch
      externalDocs:
        url: >-
          https://developers.binance.com/en/docs/catalog/web3-wallet-prediction-trading/api/rest-api/market-data#market-search
      x-connectors-examples:
        ts: >-
          https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/w3w-prediction/examples/rest-api/MarketDataApi/marketSearch.ts
        rust: >-
          https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/w3w_prediction/rest_api/market_data_api/market_search.rs
        python: >-
          https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/w3w_prediction/examples/rest_api/MarketData/market_search.py
        java: >-
          https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/w3w-prediction/src/main/java/com/binance/connector/client/w3w_prediction/rest/marketdata/MarketSearchExample.java
        go: >-
          https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/w3wprediction/examples/restapi/MarketDataAPI/MarketSearch/MarketSearch.go
        php: >-
          https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/w3w-prediction/marketdata/MarketSearchExample.php
      x-ip-weight: 1
      x-signed: true
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            example: BTC price
          description: Search keyword. Not blank
          x-description-cn: 搜尋關鍵詞，不可為空
        - name: topK
          in: query
          required: false
          schema:
            type: integer
            example: 20
            format: int32
            default: 20
            minimum: 1
            maximum: 50
          description: Max number of results to return. Default `20`, range 1–50
          x-description-cn: 最多返回結果數量，預設 `20`，範圍 1–50
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            format: int64
            example: 1770736694138
          description: >-
            Unix timestamp in milliseconds used to sign the request. The value must reflect the current client time and
            is validated by the server for signed endpoints.
          x-description-cn: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        "200":
          description: Market Search
          x-description-cn: 市場搜尋
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    marketTopicId:
                      type: integer
                      example: 4229564
                      format: int64
                    vendor:
                      type: string
                      example: PREDICT_FUN
                    chainId:
                      type: string
                      example: "56"
                    slug:
                      type: string
                      example: btc-price-1h-up-or-down
                    title:
                      type: string
                      example: BTC Price 1h Up or Down?
                    question:
                      type: string
                      example: Will BTC price go UP in the next 1 hour?
                    description:
                      type: string
                      example: Resolves YES if BTC spot price is higher than the starting price.
                    topicType:
                      type: string
                      example: FLAT
                    chartType:
                      type: string
                      example: CRYPTO_UP_DOWN
                    symbol:
                      type: string
                      example: BTCUSDT
                    participantCount:
                      type: integer
                      example: 3420
                    collateral:
                      type: string
                      example: USDT
                    tradeVolume:
                      type: string
                      example: "158234.56"
                    liquidity:
                      type: string
                      example: "45000.00"
                    startDate:
                      type: integer
                      example: 1748131200000
                      format: int64
                    endDate:
                      type: integer
                      example: 1748134800000
                      format: int64
                    status:
                      type: string
                      example: REGISTERED
                    markets:
                      type: array
                      items:
                        type: object
  /sapi/v1/w3w/wallet/prediction/market/detail:
    get:
      summary: Get Market Detail
      x-summary-cn: 獲取市場詳情
      description: Get full details for a specific prediction market topic, including variant data and timeline.
      x-description-cn: 獲取指定預測市場主題的完整詳情，包括變體資料和時間線。
      tags:
        - market-data
      operationId: getMarketDetail
      externalDocs:
        url: >-
          https://developers.binance.com/en/docs/catalog/web3-wallet-prediction-trading/api/rest-api/market-data#get-market-detail
      x-connectors-examples:
        ts: >-
          https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/w3w-prediction/examples/rest-api/MarketDataApi/getMarketDetail.ts
        rust: >-
          https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/w3w_prediction/rest_api/market_data_api/get_market_detail.rs
        python: >-
          https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/w3w_prediction/examples/rest_api/MarketData/get_market_detail.py
        java: >-
          https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/w3w-prediction/src/main/java/com/binance/connector/client/w3w_prediction/rest/marketdata/GetMarketDetailExample.java
        go: >-
          https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/w3wprediction/examples/restapi/MarketDataAPI/GetMarketDetail/GetMarketDetail.go
        php: >-
          https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/w3w-prediction/marketdata/GetMarketDetailExample.php
      x-ip-weight: 1
      x-signed: true
      parameters:
        - name: marketTopicId
          in: query
          required: true
          schema:
            type: integer
            example: 4229564
            format: int64
            minimum: 1
          description: Market topic ID. Must be > 0
          x-description-cn: 市場主題 ID，必須大於 0
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            format: int64
            example: 1770736694138
          description: >-
            Unix timestamp in milliseconds used to sign the request. The value must reflect the current client time and
            is validated by the server for signed endpoints.
          x-description-cn: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        "200":
          description: Get Market Detail
          x-description-cn: 獲取市場詳情
          content:
            application/json:
              schema:
                type: object
                properties:
                  marketTopicId:
                    type: integer
                    example: 4229564
                    format: int64
                  vendor:
                    type: string
                    example: PREDICT_FUN
                  chainId:
                    type: string
                    example: "56"
                  slug:
                    type: string
                    example: btc-price-1h-up-or-down
                  title:
                    type: string
                    example: BTC Price 1h Up or Down?
                  question:
                    type: string
                    example: Will BTC price go UP in the next 1 hour?
                  description:
                    type: string
                    example: Resolves YES if BTC spot price is higher than the starting price at resolution time.
                  imageUrl:
                    type: string
                    example: https://cdn.example.com/prediction/btc-1h.png
                  topicType:
                    type: string
                    example: FLAT
                  chartType:
                    type: string
                    example: CRYPTO_UP_DOWN
                  symbol:
                    type: string
                    example: BTCUSDT
                  variantData:
                    type: object
                    properties:
                      type:
                        type: string
                        example: CRYPTO_UP_DOWN
                      startPrice:
                        type: string
                        example: "67890.12"
                      endPrice:
                        type: string
                        example: null
                        nullable: true
                      priceFeedId:
                        type: string
                        example: 0xpricefeedid123
                      priceFeedProvider:
                        type: string
                        example: BINANCE
                      priceFeedSymbol:
                        type: string
                        example: BTCUSDT
                  participantCount:
                    type: integer
                    example: 3420
                  collateral:
                    type: string
                    example: USDT
                  feeRateBps:
                    type: integer
                    example: 200
                  slippageBps:
                    type: integer
                    example: 1200
                  isYieldBearing:
                    type: boolean
                    example: false
                  tradeVolume:
                    type: string
                    example: "158234.56"
                  liquidity:
                    type: string
                    example: "45000.00"
                  publishedAt:
                    type: integer
                    example: 1748100000000
                    format: int64
                  startDate:
                    type: integer
                    example: 1748131200000
                    format: int64
                  endDate:
                    type: integer
                    example: 1748134800000
                    format: int64
                  status:
                    type: string
                    example: REGISTERED
                  timeline:
                    type: array
                    items:
                      type: object
                      properties:
                        marketTopicId:
                          type: integer
                          example: 4229560
                          format: int64
                        startDate:
                          type: integer
                          example: 1748127600000
                          format: int64
                        endDate:
                          type: integer
                          example: 1748131200000
                          format: int64
                  markets:
                    type: array
                    items:
                      type: object
                      properties:
                        marketId:
                          type: integer
                          example: 5567895
                          format: int64
                        externalId:
                          type: string
                          example: ext_001
                        title:
                          type: string
                          example: UP
                        question:
                          type: string
                          example: Will BTC go UP?
                        description:
                          type: string
                          example: Resolves YES if BTC price increases.
                        conditionId:
                          type: string
                          example: "0xabc123"
                        status:
                          type: string
                          example: REGISTERED
                        tradingStatus:
                          type: string
                          example: OPEN
                        tradeVolume:
                          type: string
                          example: "90000.00"
                        liquidity:
                          type: string
                          example: "25000.00"
                        decimalPrecision:
                          type: integer
                          example: 2
                        outcomes:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                example: "YES"
                              price:
                                type: string
                                example: "0.52"
                              chance:
                                type: string
                                example: "0.52"
                              index:
                                type: integer
                                example: 0
                              tokenId:
                                type: string
                                example: "112233"
  /sapi/v1/w3w/wallet/prediction/order-book:
    get:
      summary: Query Order Book
      x-summary-cn: 查詢訂單簿
      description: Get the current order book (bids and asks) for a specific prediction market outcome token.
      x-description-cn: 獲取指定預測市場結果 Token 的當前訂單簿（買單和賣單）。
      tags:
        - market-data
      operationId: queryOrderBook
      externalDocs:
        url: >-
          https://developers.binance.com/en/docs/catalog/web3-wallet-prediction-trading/api/rest-api/market-data#query-order-book
      x-connectors-examples:
        ts: >-
          https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/w3w-prediction/examples/rest-api/MarketDataApi/queryOrderBook.ts
        rust: >-
          https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/w3w_prediction/rest_api/market_data_api/query_order_book.rs
        python: >-
          https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/w3w_prediction/examples/rest_api/MarketData/query_order_book.py
        java: >-
          https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/w3w-prediction/src/main/java/com/binance/connector/client/w3w_prediction/rest/marketdata/QueryOrderBookExample.java
        go: >-
          https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/w3wprediction/examples/restapi/MarketDataAPI/QueryOrderBook/QueryOrderBook.go
        php: >-
          https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/w3w-prediction/marketdata/QueryOrderBookExample.php
      x-ip-weight: 1
      x-signed: true
      parameters:
        - name: vendor
          in: query
          required: true
          schema:
            type: string
            example: predict_fun
          description: Vendor identifier (e.g. `predict_fun`)
          x-description-cn: 供應商標識（例如 `predict_fun`）
        - name: marketId
          in: query
          required: true
          schema:
            type: integer
            example: 5567895
            format: int64
            minimum: 1
          description: Market ID. Must be > 0
          x-description-cn: 市場 ID，必須大於 0
        - name: tokenId
          in: query
          required: true
