                  type: string
                  example: BEP20
                  description: Network (e.g. `BEP20`)
                  x-description-cn: 網路（如 `BEP20`）
                amount:
                  type: string
                  example: "100.00"
                  description: Amount to withdraw (must be > 0)
                  x-description-cn: 出金數量（必須 > 0）
                withdrawOrderId:
                  type: string
                  example: wd_20260814_001
