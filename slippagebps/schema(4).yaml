  /sapi/v1/w3w/wallet/prediction/trade/batch-cancel:
    post:
      summary: Batch Cancel Orders (PREDICTION_TRADE)
      x-summary-cn: 批次撤單 (PREDICTION_TRADE)
      description: >-
        Cancel one or more active prediction orders in a single request. Requires SAS authorization.


        **Known Issue — Bracket Encoding Incompatibility:**

        This endpoint uses indexed bracket notation (`cancelInfoList[0].orderId`). Binance SAPI signature verification
        runs over the **raw, unencoded** canonical string. However, mainstream HTTP libraries (Python `requests`, Java
        `HttpURLConnection`/`URI`, Go `net/url`, Node.js `url`) automatically percent-encode `[` → `%5B` and `]` →
        `%5D`, producing a signature mismatch with error `-1022 Signature for this request is not valid`. Postman is
        unaffected because it does not encode keys.


        **Workarounds** (use low-level HTTP APIs that do not normalize URLs):

        - **Python:** use `http.client` (stdlib) and hand-build the body string.

        - **Java:** use `HttpURLConnection` and write the raw body bytes directly.

        - **Go:** use `strings.NewReader` with a hand-built body instead of `url.Values.Encode()`.
      x-description-cn: >-
        在單次請求中撤銷一個或多個活躍預測訂單。需要 SAS 授權。


        **已知問題 — 方括號編碼相容性問題：**

        該介面使用帶索引的方括號表示法（`cancelInfoList[0].orderId`）。Binance SAPI 對**原始未編碼**的參數字串進行簽名校驗，但主流 HTTP 庫（Python
        `requests`、Java `HttpURLConnection`/`URI`、Go `net/url`、Node.js `url`）會將 `[` 自動編碼為 `%5B`，`]` 編碼為 `%5D`，導致簽名不匹配，返回
        `-1022 Signature for this request is not valid`。Postman 不受此影響，因其不對鍵名進行編碼。


        **臨時繞過方案**（使用不自動規範化 URL 的底層 HTTP 介面）：

        - **Python：** 使用 `http.client`（標準庫），手動拼接 body 字串。

        - **Java：** 使用 `HttpURLConnection`，直接寫入原始 body 位元組。

        - **Go：** 使用 `strings.NewReader` 手動構建 body，不使用 `url.Values.Encode()`。
      tags:
        - trade
      operationId: batchCancelOrders
      externalDocs:
        url: >-
          https://developers.binance.com/en/docs/catalog/web3-wallet-prediction-trading/api/rest-api/trade#batch-cancel-orders
      x-connectors-examples:
        ts: >-
          https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/w3w-prediction/examples/rest-api/TradeApi/batchCancelOrders.ts
        rust: >-
          https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/w3w_prediction/rest_api/trade_api/batch_cancel_orders.rs
        python: >-
          https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/w3w_prediction/examples/rest_api/Trade/batch_cancel_orders.py
        java: >-
          https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/w3w-prediction/src/main/java/com/binance/connector/client/w3w_prediction/rest/trade/BatchCancelOrdersExample.java
        go: >-
          https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/w3wprediction/examples/restapi/TradeAPI/BatchCancelOrders/BatchCancelOrders.go
        php: >-
          https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/w3w-prediction/trade/BatchCancelOrdersExample.php
      x-ip-weight: 1
      x-security-type: PREDICTION_TRADE
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: >-
            An API Key is required to access this endpoint and must be included in the request headers. To create an API
            Key, refer to:
            [https://www.binance.com/en/support/faq/detail/360002502072](https://www.binance.com/en/support/faq/detail/360002502072).
          x-description-cn: >-
            访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API
            Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            format: int64
            example: 1770736694138
          description: >-
            Unix timestamp in milliseconds used to sign the request. The value must reflect the current client time and
            is validated by the server for signed endpoints.
          x-description-cn: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      x-parameters-notes: >-
        - Use dot notation for nested list fields: `cancelInfoList[0].orderId`, `cancelInfoList[1].orderId`, etc.

        - `vendor` does not need to be supplied. The server automatically sets the correct vendor (`predict_fun`) for
        every item in the batch.
      x-parameters-notes-cn: |-
        - 巢狀列表欄位使用點號表示法：`cancelInfoList[0].orderId`、`cancelInfoList[1].orderId` 等。
        - 無需提供 `vendor` 欄位，服務端會自動為批次中每項設定正確的 vendor 值（`predict_fun`）。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - walletAddress
                - walletId
              properties:
                walletAddress:
                  type: string
                  example: "0x12e32db8817e292508c34111cbc4b23340df542c"
                  description: User's prediction wallet address
                  x-description-cn: 使用者預測錢包地址
                walletId:
                  type: string
                  example: 5b5c1ec3be4e4416a5872b21c1ca5d20
                  description: Wallet ID
                  x-description-cn: 錢包 ID
                cancelInfoList:
                  type: array
                  description: List of orders to cancel (index `i` starts from 0)
                  x-description-cn: 待撤銷訂單列表（索引 `i` 從 0 開始）
                  items:
                    type: object
                    required:
                      - orderId
                    properties:
                      orderId:
                        type: string
                        example: "54124"
                        description: Internal order ID to cancel
                        x-description-cn: 待撤銷的內部訂單 ID
      responses:
        "200":
          description: Batch Cancel Orders
          x-description-cn: 批次撤單
          content:
            application/json:
              schema:
                type: object
                properties:
                  canceled:
                    type: array
                    items:
                      type: string
                      example: "54124"
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        orderId:
                          type: string
                          example: "54126"
                        reason:
                          type: string
                          example: ORDER_NOT_FOUND
