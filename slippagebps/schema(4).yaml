            Key, refer to:
            [https://www.binance.com/en/support/faq/detail/360002502072](https://www.binance.com/en/support/faq/detail/360002502072).
          x-description-cn: >-
            访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API
            Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            format: int64
            example: 1770736694138
          description: >-
            Unix timestamp in milliseconds used to sign the request. The value must reflect the current client time and
            is validated by the server for signed endpoints.
          x-description-cn: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      x-parameters-notes: >-
        - Restricted to authorized market makers. Requests from unauthorized accounts are rejected — contact BD to
        request access.

        - walletType Validation:

          | Value           | Behavior                       |
          | --------------- | ------------------------------- |
          | `null`          | Allowed — defaults to SPOT      |
          | `0`             | Allowed — source = SPOT         |
          | `1`             | Allowed — source = FUNDING      |
          | Other (e.g. `99`) | Rejected — returns validation error |
        - "Note on field naming: this endpoint uses `walletType` (INT `0`/`1`) for the source CEX account, while Apply
        MM Deposit uses `accountType` (STRING `SPOT`/`FUNDING`) for the target. The difference is intentional: withdraw
        reuses the existing `v1/capital/withdraw/apply` flow, which inherits that flow's integer `walletType` field."
      x-parameters-notes-cn: >-
